<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Swiftwing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a3a5c'/%3E%3Cpath d='M7 10h18v12H7z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M7 10l9 7 9-7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="app-login-page">
  <main class="app-login">
    <div class="app-brand app-login-brand">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M7 10h18v12H7z" fill="none" stroke="#fff" stroke-width="2"/><path d="M7 10l9 7 9-7" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <span>Swiftwing</span>
    </div>
    <form class="app-login-card" id="login-form" novalidate>
      <h1>Log in</h1>
      <div class="app-login-error" id="login-error" role="alert" hidden></div>
      <div class="app-field">
        <label for="username">Username</label>
        <input class="app-input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      </div>
      <div class="app-field">
        <label for="password">Password</label>
        <input class="app-input" id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="app-btn app-btn-primary app-login-submit" type="submit">Log in</button>
      <p class="app-login-setup" id="login-setup" hidden>
        No accounts exist yet. On the server, create the first admin with
        <code>swiftwing-user add yourname --admin</code>.
      </p>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
